<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6e6e6">
  <meta name="description" content="A collection of screenshots and memories from our servers and meetups.">
  <title>IIAN Server Photobook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>IIAN SERVER PHOTOBOOK</h1>
    <p class="subtitle">Developed by JH</p>
    <nav class="gallery-nav" aria-label="Photo collections">
      <button class="nav-button" type="button" data-gallery-id="irl-meetup" aria-pressed="false">IRL Meetup</button>
      <button class="nav-button" type="button" data-gallery-id="pixelmon" aria-pressed="false">Pixelmon</button>
      <button class="nav-button" type="button" data-gallery-id="cobblemon" aria-pressed="true">Cobblemon</button>
      <details class="misc-menu">
        <summary class="nav-button">Misc. <span aria-hidden="true">▾</span></summary>
        <div class="misc-dropdown">
          <button type="button" data-gallery-id="uhcs" class="dropdown-button">UHCS</button>
        </div>
      </details>
    </nav>
  </header>

  <main>
    <section class="gallery-section" aria-labelledby="gallery-title">
      <div class="gallery-heading">
        <h2 id="gallery-title">Cobblemon Gallery</h2>
        <p id="gallery-status" class="gallery-status" role="status" aria-live="polite"></p>
      </div>
      <div id="gallery" class="gallery" aria-label="Photos"></div>
      <p id="gallery-message" class="gallery-message" role="status" hidden></p>
      <button id="load-more" class="load-more" type="button" hidden>Load More Photos</button>
    </section>
  </main>

  <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
    <div class="lightbox-content">
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close photo viewer">×</button>
      <button id="lightbox-previous" class="lightbox-arrow lightbox-previous" type="button" aria-label="Previous photo">‹</button>
      <img id="lightbox-image" class="lightbox-image" alt="">
      <button id="lightbox-next" class="lightbox-arrow lightbox-next" type="button" aria-label="Next photo">›</button>
      <div class="lightbox-caption">
        <span id="lightbox-filename"></span>
        <span id="lightbox-counter"></span>
      </div>
    </div>
  </dialog>
</body>
</html>
